<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Owner Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white p-6 sm:p-8 rounded-2xl shadow-sm border space-y-6">
        <div class="text-center space-y-1">
            <h1 class="text-xl font-bold text-gray-900">Salon Owner Portal</h1>
            <p class="text-xs text-gray-500">Log in to manage your salon dashboard</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Salon Slug or Email</label>
                <input type="text" id="userInput" required placeholder="e.g. furqan or owner@veronacuts.com" 
                    class="w-full p-3 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full p-3 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50">
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl font-bold text-xs transition shadow-sm">
                Log In
            </button>
        </form>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        async function handleLogin(event) {
            event.preventDefault();
            const inputVal = document.getElementById('userInput').value.trim();

            try {
                // Fetch salons list to find the correct matching slug
                const salonRes = await fetch(`${API_URL}/salons`);
                if (!salonRes.ok) throw new Error("Could not connect to backend server.");
                const salons = await salonRes.json();

                let targetSlug = inputVal;

                // Agar user ne email diya hai, toh us se match karta hua salon slug dhoond lo
                if (inputVal.includes('@')) {
                    const matchedSalon = salons.find(s => s.owner_email === inputVal || s.email === inputVal);
                    if (matchedSalon) {
                        targetSlug = matchedSalon.slug;
                    } else if (salons.length > 0) {
                        targetSlug = salons[0].slug;
                    }
                }

                // Save dummy token so admin.html doesn't block access
                localStorage.setItem("admin_token", "test_bypass_token");

                // Redirect directly to admin dashboard with the correct slug
                window.location.href = `admin.html?salon=${encodeURIComponent(targetSlug)}`;
            } catch (err) {
                alert("Login Error: " + err.message);
            }
        }
    </script>
</body>
</html>
