<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - All Salons</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">
    <div class="max-w-3xl mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between my-0 md:my-6 md:rounded-3xl overflow-hidden">
        
        <header class="bg-gray-900 text-white p-6 flex justify-between items-center shadow-md">
            <div>
                <h1 class="text-xl font-bold">👑 Super Admin Dashboard</h1>
                <p class="text-gray-400 text-xs mt-0.5">Manage all client salons, IDs, and passwords</p>
            </div>
            <button onclick="toggleCreateModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-indigo-700 transition">
                + Create New Salon
            </button>
        </header>

        <main class="p-6 flex-grow space-y-6">
            
            <!-- Create Salon Form Card -->
            <div id="create-salon-card" class="hidden bg-indigo-50 border border-indigo-200 p-5 rounded-2xl space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-bold text-indigo-900">Create a New Client Salon</h2>
                    <button onclick="toggleCreateModal()" class="text-gray-400 hover:text-gray-600 text-xs font-bold">✕ Close</button>
                </div>
                <form id="create-form" onsubmit="createSalon(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Salon Name</label>
                        <input type="text" id="salon-name" required class="w-full p-2.5 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Milan Hair Studio">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">URL Slug</label>
                        <input type="text" id="salon-slug" required class="w-full p-2.5 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. milan-hair">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Owner Email</label>
                        <input type="email" id="salon-owner" class="w-full p-2.5 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-indigo-500" placeholder="owner@gmail.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Admin Password</label>
                        <input type="text" id="salon-pass" required value="admin123" class="w-full p-2.5 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-indigo-500 font-mono">
                    </div>
                    <div class="sm:col-span-2 flex justify-end pt-2">
                        <button type="submit" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs hover:bg-indigo-700 transition">
                            Save & Generate Credentials
                        </button>
                    </div>
                </form>
            </div>

            <!-- Master List Section -->
            <div class="space-y-3">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400">Records of All Existing Salons</h2>
                <div id="salons-master-list" class="space-y-3">
                    <div class="p-6 border rounded-2xl text-center text-sm text-gray-400">Loading all salons from backend...</div>
                </div>
            </div>
        </main>

        <footer class="p-4 text-center text-xs text-gray-400 border-t">
            Super Admin Control Panel
        </footer>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        function toggleCreateModal() {
            const card = document.getElementById('create-salon-card');
            card.classList.toggle('hidden');
        }

        async function loadMasterSalons() {
            const listDiv = document.getElementById('salons-master-list');
            try {
                const res = await fetch(`${API_URL}/salons`);
                if (!res.ok) throw new Error("Failed to load salons");
                const salons = await res.json();

                if (salons.length === 0) {
                    listDiv.innerHTML = `<div class="p-6 border rounded-2xl text-center text-sm text-gray-400">No salons created yet. Click "+ Create New Salon" above.</div>`;
                    return;
                }

                listDiv.innerHTML = salons.map(s => {
                    const isActive = s.is_active !== false;
                    const salonId = String(s.id);
                    return `
                        <div class="border p-4 rounded-2xl bg-gray-50 space-y-3 shadow-sm">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h3 class="font-bold text-gray-800 text-sm">${s.name}</h3>
                                        <span class="px-2 py-0.5 text-[10px] font-bold rounded-full ${isActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                            ${isActive ? 'Active' : 'Paused / Expired'}
                                        </span>
                                    </div>
                                    <p class="text-xs text-gray-500 font-mono mt-0.5">Slug: ${s.slug} | Owner: ${s.owner_email || 'N/A'}</p>
                                </div>
                                <div class="flex flex-wrap gap-2">
                                    <button type="button" onclick="toggleSalonStatus('${salonId}', ${isActive})" class="${isActive ? 'bg-amber-100 text-amber-800 border-amber-300 hover:bg-amber-200' : 'bg-green-600 text-white hover:bg-green-700'} px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                                        ${isActive ? '⏸️ Pause Salon' : '▶️ Activate'}
                                    </button>
                                    <a href="index.html?salon=${s.slug}" target="_blank" class="bg-white border px-3 py-1.5 rounded-xl text-xs font-semibold hover:bg-gray-100 transition">View Portal</a>
                                    <a href="admin.html?salon=${s.slug}" target="_blank" class="bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-xl text-xs font-semibold hover:bg-indigo-100 transition">Admin Login</a>
                                </div>
                            </div>
                            <div class="bg-white p-3 rounded-xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs font-mono">
                                <div><span class="text-gray-400">Salon ID:</span> <strong class="text-indigo-600">${s.id}</strong></div>
                                <div><span class="text-gray-400">Password:</span> <strong class="text-rose-600">${s.admin_password || 'admin123'}</strong></div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                listDiv.innerHTML = `
                    <div class="p-6 border border-red-200 bg-red-50 rounded-2xl text-center text-sm text-red-600 space-y-2">
                        <p class="font-bold">⚠️ Error connecting to backend server at ${API_URL}</p>
                        <p class="text-xs">Make sure your FastAPI backend terminal is running!</p>
                        <button onclick="loadMasterSalons()" class="mt-2 bg-red-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">Retry Connection</button>
                    </div>
                `;
            }
        }

        async function toggleSalonStatus(salonId, currentStatus) {
            const newStatus = !currentStatus;
            try {
                const res = await fetch(`${API_URL}/salons/${salonId}/settings`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_active: newStatus })
                });

                if (!res.ok) throw new Error("Failed to update status");
                loadMasterSalons();
            } catch (err) {
                alert("Error updating salon subscription status.");
            }
        }

        async function createSalon(event) {
            event.preventDefault();
            const name = document.getElementById('salon-name').value;
            const slug = document.getElementById('salon-slug').value;
            const owner_email = document.getElementById('salon-owner').value;
            const admin_password = document.getElementById('salon-pass').value;

            try {
                const res = await fetch(`${API_URL}/salons`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, slug, owner_email, admin_password })
                });

                if (!res.ok) throw new Error("Failed to create salon");

                alert("Salon created successfully!");
                document.getElementById('create-form').reset();
                document.getElementById('salon-pass').value = 'admin123';
                toggleCreateModal();
                loadMasterSalons();
            } catch (err) {
                alert("Error creating salon. Make sure the backend is running and slug is unique.");
            }
        }

        loadMasterSalons();
    </script>
</body>
</html>
