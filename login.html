<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Owner Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between p-4">

    <!-- Top Language Bar -->
    <div class="max-w-md w-full mx-auto flex justify-end pt-2">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-white text-gray-700 text-xs font-semibold px-3 py-1.5 rounded-lg border shadow-sm focus:outline-none cursor-pointer">
            <option value="en">English</option>
            <option value="it">Italiano</option>
        </select>
    </div>

    <!-- Login Card -->
    <div class="max-w-md w-full mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-sm border space-y-6 my-auto">
        <div class="text-center space-y-1">
            <h1 id="header-title" class="text-xl font-bold text-gray-900">Salon Owner Portal</h1>
            <p id="header-subtitle" class="text-xs text-gray-500">Log in to manage your salon dashboard</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label id="lbl-user-input" class="block text-xs font-semibold text-gray-600 mb-1">Salon Slug or Email</label>
                <input type="text" id="userInput" required placeholder="enter your username or email" 
                    class="w-full p-3 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50">
            </div>

            <div>
                <label id="lbl-password" class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full p-3 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50">
            </div>

            <button type="submit" id="btn-login"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl font-bold text-xs transition shadow-sm">
                Log In
            </button>
        </form>
    </div>

    <!-- Footer -->
    <footer id="txt-footer" class="py-4 text-center text-xs text-gray-400">
        Salon Owner Portal
    </footer>

    <script>
        const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost" 
            ? "http://127.0.0.1:8000" 
            : "https://salon-saas-backend-na9l.onrender.com";
        let currentLang = 'en';

        const translations = {
            en: {
                title: "Salon Owner Portal",
                subtitle: "Log in to manage your salon dashboard",
                userInputLabel: "Salon Slug or Email",
                userInputPlaceholder: "enter your username or email",
                passwordLabel: "Password",
                loginBtn: "Log In",
                footer: "All rights reserved by appvita",
                errorServer: "Could not connect to backend server.",
                errorLogin: "Login Error: "
            },
            it: {
                title: "Portale Proprietario Salone",
                subtitle: "Accedi per gestire la dashboard del tuo salone",
                userInputLabel: "Slug del Salone o Email",
                userInputPlaceholder: "es. furqan o owner@veronacuts.com",
                passwordLabel: "Password",
                loginBtn: "Accedi",
                footer: "Portale Proprietario Salone",
                errorServer: "Impossibile connettersi al server di backend.",
                errorLogin: "Errore di accesso: "
            }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.getElementById('header-title').innerText = t.title;
            document.getElementById('header-subtitle').innerText = t.subtitle;
            document.getElementById('lbl-user-input').innerText = t.userInputLabel;
            document.getElementById('userInput').placeholder = t.userInputPlaceholder;
            document.getElementById('lbl-password').innerText = t.passwordLabel;
            document.getElementById('btn-login').innerText = t.loginBtn;
            document.getElementById('txt-footer').innerText = t.footer;
        }

        async function handleLogin(event) {
            event.preventDefault();
            const t = translations[currentLang];
            const inputVal = document.getElementById('userInput').value.trim();

            try {
                const salonRes = await fetch(`${API_URL}/salons`);
                if (!salonRes.ok) throw new Error(t.errorServer);
                const salons = await salonRes.json();

                let targetSlug = inputVal;

                if (inputVal.includes('@')) {
                    const matchedSalon = salons.find(s => s.owner_email === inputVal || s.email === inputVal);
                    if (matchedSalon) {
                        targetSlug = matchedSalon.slug;
                    } else if (salons.length > 0) {
                        targetSlug = salons[0].slug;
                    }
                }

                localStorage.setItem("admin_token", "test_bypass_token");
                window.location.href = `admin.html?salon=${encodeURIComponent(targetSlug)}`;
            } catch (err) {
                alert(t.errorLogin + err.message);
            }
        }
    </script>
</body>
</html>
